name: 기능 작업
description: 새로운 기능이나 개선 작업을 정의합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 왜 이 작업이 필요한가요?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 이번 작업에서 할 일을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 검증 가능한 완료 조건을 적어주세요.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 범위 밖
      description: 이번 작업에서 하지 않을 일을 적어주세요.
